name: Picket Studio Overlay Build

"on":
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "intellij-community 上游 ref（分支或 tag，如 master / idea/2026.2.3）"
        default: "master"
        required: true
      os_target:
        description: "目标平台：current / linux / windows / mac"
        default: "current"
        required: false
      dry_run:
        description: "仅验证 patch 与 Bazel 构建图，不执行完整构建"
        type: boolean
        default: false
      publish_release:
        description: "构建成功后发布 GitHub Release（tag: picket-studio-<ref>）"
        type: boolean
        default: false
      build_number:
        description: "覆盖构建号（如 262.10968.63）；空则用上游默认（SNAPSHOT）"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  overlay-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/ghc /opt/hostedtoolcache \
            /var/cache/apt/archives || true
          sudo apt-get -y clean || true
          docker image prune --all --force || true

      - name: Expand swap (IDE build is memory hungry, JetBrains CI uses 30G)
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 30G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=30720
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Checkout overlay repo (this repo)
        uses: actions/checkout@v5
        with:
          path: overlay

      - name: Checkout upstream intellij-community
        uses: actions/checkout@v5
        with:
          repository: JetBrains/intellij-community
          ref: ${{ inputs.upstream_ref }}
          path: community
          fetch-depth: 1

      # partial clone (blob:none) 下按需拉取 blob 会偶发缺文件（多个模块 plugin.xml 缺失导致构建校验失败），
      # 用 codeload tarball 确定性补全工作树（保留 .git；tar 内容=同一 commit 快照）
      - name: Backfill working tree from codeload tarball
        working-directory: community
        shell: bash
        run: |
          git ls-files -z | xargs -0 rm -f 2>/dev/null || true
          find . -path ./.git -prune -o -type f -print0 | xargs -0 rm -f 2>/dev/null || true
          find . -path ./.git -prune -o -type d -empty -delete 2>/dev/null || true
          REF="${{ inputs.upstream_ref }}"
          URL="https://codeload.github.com/JetBrains/intellij-community/tar.gz/refs/tags/${REF}"
          echo "downloading ${URL} ..."
          curl -fsSL "$URL" -o /tmp/up.tar.gz || {
            URL="https://codeload.github.com/JetBrains/intellij-community/tar.gz/refs/heads/${REF}"
            echo "fallback ${URL}"
            curl -fsSL "$URL" -o /tmp/up.tar.gz
          }
          tar -xzf /tmp/up.tar.gz --strip-components=1
          rm -f /tmp/up.tar.gz
          echo "=== backfill verify ==="
          ls tools/intellij.lambda.sampleTestsWithPlugin/plugin/testResources/META-INF/ 2>&1
          ls libraries/misc/plugin/resources/META-INF/ 2>&1

      - name: Fetch android modules (required for IDEA distributions)
        working-directory: community
        shell: bash
        run: |
          # android 模块 ref 必须与 upstream_ref 匹配（tag 版源码引用对应 tag 的 iml 文件）
          ANDROID_REF="${{ inputs.upstream_ref }}"
          if [ "$ANDROID_REF" = "master" ] || [ "$ANDROID_REF" = "main" ]; then ANDROID_REF="master"; fi
          if [ ! -d android ]; then
            git clone --depth 1 --branch "$ANDROID_REF" https://github.com/JetBrains/android.git android \
              || git clone --depth 1 --branch master https://github.com/JetBrains/android.git android \
              || git clone --depth 1 https://github.com/JetBrains/android.git android \
              || echo "WARN: android module fetch failed, continuing anyway"
          fi

      - name: Apply overlay patches
        working-directory: community
        shell: bash
        run: |
          for p in ../overlay/patches/*.patch; do
            echo "== apply $(basename "$p") =="
            # 纯文本应用：patch 均基于 upstream tag 精确生成，不依赖 partial-clone blob（--3way 会因缺 blob 失败）
            git apply "$p" || exit 1
          done
          echo "patches applied OK"
          git status --short | head -20

      - name: Override build number (optional, e.g. 262.10968.63)
        working-directory: community
        shell: bash
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            echo "${{ inputs.build_number }}" > build.txt
            echo "build.txt -> $(cat build.txt)"
          else
            echo "keep upstream default build.txt: $(cat build.txt)"
          fi

      - name: Verify build graph with Bazel query
        working-directory: community
        shell: bash
        run: |
          echo "== DIAG: lambda plugin dir contents =="
          ls -la tools/intellij.lambda.sampleTestsWithPlugin/plugin/ | head -20
          echo "== DIAG: testResources recursive =="
          find tools/intellij.lambda.sampleTestsWithPlugin/plugin/testResources -type f 2>&1 | head -10 || true
          echo "== DIAG: HEAD =="
          git log -1 --format='%H'
          ./bazel.cmd query //build:idea_community >/dev/null
          echo "build target //build:idea_community resolves OK"

      - name: Dry-run complete
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: echo 'dry-run done, patches applied, build graph OK'

      - name: Build Docker build environment
        if: ${{ inputs.dry_run != true }}
        working-directory: community
        shell: bash
        run: docker build . --target intellij_idea --tag picket_build_env

      - name: Build Picket Studio installers
        if: ${{ inputs.dry_run != true }}
        working-directory: community
        shell: bash
        run: |
          # skip search_index: traverseUI 在 headless 容器内偶发 exit 255（官方 CI 的 update target 同样跳过该步骤）
          docker run --rm --user "$(id -u)" -v "${PWD}:/community" \
            picket_build_env -Dintellij.build.target.os=${{ inputs.os_target }} \
            -Dintellij.build.skip.build.steps=search_index

      - name: Compute artifact name (sanitize ref)
        if: ${{ inputs.dry_run != true }}
        id: artname
        run: |
          SAFE_REF=$(echo "${{ inputs.upstream_ref }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "name=picket-studio-${SAFE_REF}-${{ inputs.os_target }}" >> "$GITHUB_OUTPUT"
          echo "safe_ref=${SAFE_REF}" >> "$GITHUB_OUTPUT"
          echo "tag=picket-studio-${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.artname.outputs.name }}
          path: community/out/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ inputs.dry_run != true && inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artname.outputs.tag }}
          name: Picket Studio ${{ inputs.upstream_ref }}
          body: |
            Picket Studio 发行版（基于 IntelliJ Platform Community）
            - 上游: ${{ inputs.upstream_ref }}
            - 构建: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 许可: Apache 2.0（见发行包内 LICENSE/NOTICE），未受 JetBrains 背书
            - 安装: 解压后运行 bin/idea（内置 JBR）
          files: |
            community/out/**/artifacts/*.tar.gz
            community/out/**/artifacts/*.sha256
            community/out/**/artifacts/*.product-info.json
          fail_on_unmatched_assertions: false
