name: Picket Studio Overlay Build

"on":
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "intellij-community 上游 ref（分支或 tag，如 master / idea/2026.2.3）"
        default: "master"
        required: true
      os_target:
        description: "目标平台：current / linux / windows / mac"
        default: "current"
        required: false
      dry_run:
        description: "仅验证 patch 与 Bazel 构建图，不执行完整构建"
        type: boolean
        default: false
      publish_release:
        description: "构建成功后发布 GitHub Release（tag: picket-studio-<ref>）"
        type: boolean
        default: false
      build_number:
        description: "覆盖构建号（如 262.10968.63）；空则用上游默认（SNAPSHOT）"
        default: ""
        required: false
      apply_trim:
        description: "应用插件裁剪 patch 07（对照实验时设为 false）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  overlay-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/ghc /opt/hostedtoolcache \
            /var/cache/apt/archives || true
          sudo apt-get -y clean || true
          docker image prune --all --force || true

      - name: Expand swap (IDE build is memory hungry, JetBrains CI uses 30G)
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 30G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=30720
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Checkout overlay repo (this repo)
        uses: actions/checkout@v5
        with:
          path: overlay

      # 完整 checkout（无 partial clone）：blob:none 按需拉 blob 偶发失败会导致目录缺失、
      # Bazel glob 空、JPS 模型缺模块（r63 之后镜像 bazel 严格 glob 使问题放大）。
      # actions/checkout 不接受 filter:none，改用原生 git clone --no-filter（Actions 内网快，5GB 约 10-20 分钟）。
      - name: Checkout upstream intellij-community (codeload tarball, always complete)
        shell: bash
        run: |
          REF="${{ inputs.upstream_ref }}"
          ENC_REF="${REF//\//%2F}"
          TARBALL="https://codeload.github.com/JetBrains/intellij-community/tar.gz/refs/tags/${ENC_REF}"
          for i in 1 2 3; do
            curl -L --retry 3 --retry-delay 5 -o /tmp/ce.tar.gz "$TARBALL" && break || { sleep 15; echo "retry $i"; }
          done
          tar -xzf /tmp/ce.tar.gz -C /tmp
          mv /tmp/intellij-community-* community
          cd community
          git init -q
          git config user.email ci@local && git config user.name ci
          # 统计完整性：工作树文件数（本地完整 checkout 约 30 万+）
          echo "== checkout file count =="
          find . -type f | wc -l
          # android 模块（Bazel 构建图引用；轻量 blobless 拉取，tag 不匹配也容错）
          git clone --depth 1 --filter=blob:none --branch master https://github.com/JetBrains/android.git /tmp/android 2>/dev/null \
            || git clone --depth 1 --filter=blob:none https://github.com/JetBrains/android.git /tmp/android 2>/dev/null \
            || true
          if [ -d /tmp/android ] && [ ! -d android ]; then mv /tmp/android android; fi
          ls android 2>/dev/null | head -3 || echo "WARN: android module unavailable (continuing)"
      - name: Backfill missing tracked files (safety net)
        working-directory: community
        shell: bash
        run: |
          # 完整 clone 已物化全部文件；此步仅作兜底验证关键文件
          for f in \
            tools/intellij.lambda.sampleTestsWithPlugin/plugin/testResources/META-INF/plugin.xml \
            libraries/misc/plugin/resources/META-INF/plugin.xml \
            platform/acp/plugin/resources/META-INF/plugin.xml \
            plugins/mcp-server/resources/META-INF/plugin.xml \
            java/plugin/resources/META-INF/plugin.xml \
            java/ide-customization/resources/META-INF/plugin.xml; do
            if [ ! -f "$f" ]; then echo "MISSING $f"; else echo "OK $f"; fi
          done
          echo "=== backfill verify ==="
          ls tools/intellij.lambda.sampleTestsWithPlugin/plugin/testResources/META-INF/ 2>&1
          ls libraries/misc/plugin/resources/META-INF/ 2>&1
          ls java/java-impl/resources/META-INF/ 2>&1 | head -3

      - name: Fetch android modules (required for IDEA distributions)
        working-directory: community
        shell: bash
        run: |
          # android 模块 ref 必须与 upstream_ref 匹配（tag 版源码引用对应 tag 的 iml 文件）
          ANDROID_REF="${{ inputs.upstream_ref }}"
          if [ "$ANDROID_REF" = "master" ] || [ "$ANDROID_REF" = "main" ]; then ANDROID_REF="master"; fi
          if [ ! -d android ]; then
            git clone --depth 1 --branch "$ANDROID_REF" https://github.com/JetBrains/android.git android \
              || git clone --depth 1 --branch master https://github.com/JetBrains/android.git android \
              || git clone --depth 1 https://github.com/JetBrains/android.git android \
              || echo "WARN: android module fetch failed, continuing anyway"
          fi

      - name: Apply overlay patches
        working-directory: community
        shell: bash
        run: |
          for p in ../overlay/patches/*.patch; do
            b=$(basename "$p")
            if [ "$b" = "07-plugin-trim.patch" ] && [ "${{ inputs.apply_trim }}" != "true" ]; then
              echo "== SKIP $b (apply_trim=false) =="
              continue
            fi
            echo "== apply $b =="
            # 纯文本应用：patch 均基于 upstream tag 精确生成，不依赖 partial-clone blob（--3way 会因缺 blob 失败）
            git apply "$p" || exit 1
          done
          echo "patches applied OK"
          git status --short 2>/dev/null | head -20 || true

      - name: Override build number (optional, e.g. 262.10968.63)
        working-directory: community
        shell: bash
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            echo "${{ inputs.build_number }}" > build.txt
            echo "build.txt -> $(cat build.txt)"
          else
            echo "keep upstream default build.txt: $(cat build.txt)"
          fi

      - name: Verify build graph with Bazel query
        working-directory: community
        shell: bash
        run: |
          echo "== DIAG: key module files (full clone sanity) =="
          ls java/plugin/resources/META-INF/plugin.xml 2>&1 || true
          ls tools/intellij.lambda.sampleTestsWithPlugin/plugin/testResources/META-INF/plugin.xml 2>&1 || true
          ls libraries/misc/plugin/resources/META-INF/plugin.xml 2>&1 || true
          echo "== DIAG: HEAD =="
          git log -1 --format='%H'
          ./bazel.cmd query //build:idea_community >/dev/null
          echo "build target //build:idea_community resolves OK"
          echo "== DIAG: java plugin targets =="
          ./bazel.cmd query '//java/plugin:*' 2>&1 | head -8 || true
          ./bazel.cmd query '//java/java-impl:*' 2>&1 | head -4 || true

      - name: Dry-run complete
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: echo 'dry-run done, patches applied, build graph OK'

      - name: Build Docker build environment
        if: ${{ inputs.dry_run != true }}
        working-directory: community
        shell: bash
        run: docker build . --target intellij_idea --tag picket_build_env

      - name: Build Picket Studio installers
        if: ${{ inputs.dry_run != true }}
        working-directory: community
        shell: bash
        run: |
          # skip search_index: traverseUI 在 headless 容器内偶发 exit 255（官方 CI 的 update target 同样跳过该步骤）
          docker run --rm --user "$(id -u)" -v "${PWD}:/community" \
            picket_build_env -Dintellij.build.target.os=${{ inputs.os_target }} \
            -Dintellij.build.skip.build.steps=search_index

      - name: Build diagnostics (always)
        if: ${{ inputs.dry_run != true }}
        working-directory: community
        shell: bash
        run: |
          echo "=== disk ==="
          df -h | tail -3
          echo "=== artifacts ==="
          ls -la out/picket-studio-ce/artifacts/ 2>&1 | head -30
          echo "=== dev-run plugins dir ==="
          ls out/picket-studio-ce/temp/dev-run/idea-community/plugins/ 2>&1 | head -50
          echo "=== bundled plugin modules (effective) ==="
          grep -rn "bundledPluginModules" out/picket-studio-ce/log/*.log 2>/dev/null | head -5 || true
          cat out/picket-studio-ce/artifacts/IC-builtinModules.json 2>/dev/null | head -20 || true
          echo "=== logs ==="
          ls out/log/ 2>&1 | head -10
          for f in out/log/*.log out/log/*.txt; do
            if [ -f "$f" ]; then echo "--- $f ---"; tail -80 "$f"; fi
          done 2>/dev/null | tail -160

      - name: Compute artifact name (sanitize ref)
        if: ${{ inputs.dry_run != true }}
        id: artname
        run: |
          SAFE_REF=$(echo "${{ inputs.upstream_ref }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "name=picket-studio-${SAFE_REF}-${{ inputs.os_target }}" >> "$GITHUB_OUTPUT"
          echo "safe_ref=${SAFE_REF}" >> "$GITHUB_OUTPUT"
          echo "tag=picket-studio-${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.artname.outputs.name }}
          path: community/out/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ inputs.dry_run != true && inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artname.outputs.tag }}
          name: Picket Studio ${{ inputs.upstream_ref }}
          body: |
            Picket Studio 发行版（基于 IntelliJ Platform Community）
            - 上游: ${{ inputs.upstream_ref }}
            - 构建: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 许可: Apache 2.0（见发行包内 LICENSE/NOTICE），未受 JetBrains 背书
            - 安装: 解压后运行 bin/idea（内置 JBR）
          files: |
            community/out/**/artifacts/*.tar.gz
            community/out/**/artifacts/*.sha256
            community/out/**/artifacts/*.product-info.json
          fail_on_unmatched_assertions: false
